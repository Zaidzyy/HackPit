# HackPit Cockpit — TWO-SANDBOX stack.
#
# There are THREE independent sandboxes with DIFFERENT network models — do not conflate them:
#
# 1. hackpit-kali-sandbox  (ISOLATED — the cockpit/agent sandbox; SAFETY-CRITICAL, unchanged)
#    On `hackpit-isolated` (`internal: true`): Docker attaches no gateway, so there is no NAT
#    and no route off the bridge — it reaches the lab (same network) but has NO path to the
#    host or the internet. This is the safety net the cockpit executor's 4th gate
#    (`assert_isolation_proven`) and the future autonomous agent depend on. It stays egress-less.
#
# 2. hackpit-kali-open     (NOT ISOLATED — the :kali human-only shell; Zaid's informed decision)
#    On `hackpit-open` (a normal bridge, NAT egress): reaches the internet + host + LAN. This is
#    intentional and is used ONLY by :kali (POST /cockpit/kali), which is human-driven — the
#    orchestrator/agent/executor has NO code path to it. It keeps cap_drop ALL + no-new-privileges
#    and is still disposable via `down`. An exposed :kali now reaches your host/LAN — localhost only,
#    auth required before any exposure.
#
# 3. hackpit-engage-sandbox  (SCOPE-LOCKED — the REAL-TARGET engagement sandbox; SUPERVISED, HIGHEST RISK)
#    The cockpit execs here ONLY in explicit engagement mode (real authorized targets). Its egress is
#    a per-engagement DEFAULT-DENY firewall: the sidecar hackpit-engage-firewall (the ONLY box with
#    NET_ADMIN) owns the netns and, at engagement ENTER, allows ONLY the resolved authorized scope
#    (a single host's IPs or a CIDR). The operator's host/gateway, out-of-scope LAN, cloud metadata
#    (169.254/16), IPv6 (unless scoped), and the rest of the internet are DROPped by default policy.
#    The sandbox SHARES that netns (`network_mode: service:engage-firewall`) so it stays cap_drop:ALL
#    + no-new-privileges and inherits the filter — it cannot turn inward or leave scope. Because the
#    containment is now NETWORK-enforced, the guided loop may DRAFT commands here; NEVER-AUTO-RUN
#    still requires human approval of EVERY command (loop drafts, human fires). Proof:
#    engage_scope_proof.sh (scope reachable; host/LAN/metadata/off-scope internet all dropped).
#
# All sandbox images bake their tools in at build time. The lab image is pulled at `up` time.
#
# Bring up:   docker compose -f docker/docker-compose.yml up -d --build
# Prove:      docker/proof/isolation_proof.sh            (cockpit sandbox: egress-less — hard gate)
#             docker/proof/kali_open_egress_proof.sh     (:kali open sandbox: egress reachable)
# Tear down:  docker compose -f docker/docker-compose.yml down -v

name: hackpit-cockpit

networks:
  hackpit-isolated:
    driver: bridge
    internal: true          # <-- no gateway => no host/internet route. The safety layer.
  hackpit-open:
    driver: bridge
    # NOT internal: normal bridge with NAT egress. Reaches internet + host + LAN. Used ONLY
    # by the :kali human-only shell (hackpit-kali-open). Deliberately not isolated.
  hackpit-engage:
    driver: bridge
    # NOT internal: NAT egress to the internet. This is the engagement pair's network; the
    # SCOPE-LOCK firewall sidecar sits here with NET_ADMIN and installs a DEFAULT-DENY OUTPUT
    # policy (allow only the per-engagement scope, applied at ENTER), which the sandbox inherits
    # by SHARING the sidecar's netns. Egress to anywhere but the authorized scope is dropped.

services:
  lab-target:
    # OWASP Juice Shop — the self-hosted vulnerable web app (M1 lab target).
    image: bkimminich/juice-shop:latest
    container_name: hackpit-lab-target
    hostname: hackpit-lab-target
    networks:
      - hackpit-isolated
    restart: unless-stopped
    # No published ports: the lab is reachable only from inside the isolated network.

  kali-sandbox:
    # The recon sandbox the backend execs allowlisted commands into.
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: hackpit/kali-sandbox:m1
    container_name: hackpit-kali-sandbox
    hostname: hackpit-kali-sandbox
    networks:
      - hackpit-isolated
    restart: unless-stopped
    # Defense in depth beyond network isolation:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false

  kali-open:
    # The :kali human-only shell sandbox. SAME image/tools as the isolated sandbox, but on a
    # NORMAL bridge network (NAT egress) — it reaches the internet, the host, and the LAN. That
    # is Zaid's informed decision and is used ONLY by POST /cockpit/kali (human-driven; the
    # orchestrator/agent has no path to it). NOT isolated — do NOT point cockpit/agent execution
    # here (the cockpit keeps targeting hackpit-kali-sandbox with all four gates intact).
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: hackpit/kali-sandbox:m1
    container_name: hackpit-kali-open
    hostname: hackpit-kali-open
    networks:
      - hackpit-open
    restart: unless-stopped
    # Defense in depth is KEPT even though the network is open:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false

  engage-firewall:
    # SCOPE-LOCK firewall SIDECAR for engagement mode. The ONLY engagement box with NET_ADMIN.
    # Installs a DEFAULT-DENY OUTPUT policy at start (fail-closed), holds the netns open, and
    # the backend programs the per-engagement allow-list into it (scope_lock.sh apply <scope>)
    # at ENTER / resets it (deny) at EXIT. The engagement sandbox shares this netns and inherits
    # the filter. See Dockerfile.firewall + scope_lock.sh.
    build:
      context: .
      dockerfile: Dockerfile.firewall
    image: hackpit/engage-firewall:scopelock
    container_name: hackpit-engage-firewall
    hostname: hackpit-engage-firewall
    networks:
      - hackpit-engage
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN          # needed ONLY to program the scope-lock iptables rules
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  engage-sandbox:
    # The REAL-TARGET engagement sandbox — SCOPE-LOCKED. SAME tool image as the isolated/open
    # sandboxes, but it SHARES the firewall sidecar's network namespace, so its egress is
    # DEFAULT-DENY + allow-only-the-authorized-scope (see engage-firewall). It has NO isolation
    # floor but a REAL network floor (the scope-lock), and NO NET_ADMIN — it cannot alter the
    # firewall's rules or leave scope. The cockpit execs here ONLY in explicit, human-entered
    # engagement mode. Because containment is network-enforced, the guided loop may DRAFT here;
    # NEVER-AUTO-RUN still requires human approval of EVERY command. NOT for lab runs.
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: hackpit/kali-sandbox:m1
    container_name: hackpit-engage-sandbox
    # Share the firewall's netns -> inherit the scope-lock. (No `networks:` when network_mode is set.)
    network_mode: "service:engage-firewall"
    depends_on:
      - engage-firewall
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false
    restart: unless-stopped
