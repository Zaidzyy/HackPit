[project]
name = "backend"
version = "0.1.0"
description = "HackPit backend — serves the knowledge base + hybrid search to the frontend."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    # numpy powers the vector half of pipeline/search.py (hybrid + vector modes).
    # Lexical mode needs none of it, so /search still works if this is absent.
    "numpy>=2.0",
    # cryptography is REQUIRED, not optional: oob/interactsh.py imports it at module
    # top (RSA keygen + AES-CTR decryption of interact.sh callbacks) and main.py imports
    # oob.interactsh unconditionally, so the app cannot start without it. Declared here
    # after CI caught `import main` failing on a clean checkout with a bare dependency set.
    "cryptography>=42.0",
]

[project.optional-dependencies]
# STATIC analysis scanners for the :code scan feature (backend/codescan). OPTIONAL on
# purpose: without them every other route works and the scan endpoints report a clean
# "not installed" instead of failing. Install with:  cd backend && uv pip install semgrep bandit
codescan = [
    "semgrep>=1.100",
    "bandit>=1.7",
]
# The KB ingesters that read PDF writeups. OPTIONAL for the same reason as codescan — the
# backend serves every route without it — but NOT optional for `pipeline/ingest_box_pdfs.py`,
# which does `from pypdf import PdfReader` at module import and could therefore never have run
# on a clean checkout. Found 2026-08-05 while evaluating a writeup repo; the ingester had only
# ever been run in an environment where pypdf happened to be present.
#   cd backend && uv pip install --python .venv/Scripts/python.exe pypdf
pipeline = [
    "pypdf>=6.0",
]
# The MCP server (backend/mcp_server.py — build #19 item 6). OPTIONAL because it is a SEPARATE
# PROCESS an operator registers with an MCP client; the backend serves every route without it.
# Deliberately not required by the safety lock either: `backend/mcp_tools.py` holds the registry
# and both audits and imports nothing from `mcp`, so `test_mcp_safety.py` enumerates every
# exposed tool in CI where this group is absent.
#   cd backend && uv pip install --python .venv/Scripts/python.exe mcp
mcp = [
    "mcp>=1.0",
]
