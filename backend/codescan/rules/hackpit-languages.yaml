# HackPit bundled Semgrep ruleset — EXTRA LANGUAGES (Java · Go · PHP · Ruby · C#).
#
# The base file (hackpit-security.yaml) covers Python/JS/TS. This one extends the OFFLINE
# bundle to the languages the base set didn't reach, so a scan of a Java/Go/PHP/Ruby/C#
# codebase returns findings with no network, no account and no registry availability. A
# registry ruleset (p/security-audit, p/java, …) can still be selected explicitly when the
# operator wants the full catalogue (that form needs network) — see docs/CODE-SCAN.md.
#
# Scope: the same high-signal classes the base set targets — injection, unsafe
# deserialization, code-eval, file inclusion, SSRF — the ones a reviewer actually acts on.
# Each rule carries CWE + OWASP metadata so a finding groups the same way as the Python set.
rules:
  # ============================================================ Java
  - id: hp-java-os-command-injection
    languages: [java]
    severity: WARNING
    message: >-
      OS command executed from Java. If any argument is caller-controlled this is command
      injection — pass a validated argv and avoid shell interpolation.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      category: injection
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($X)
          - pattern: new ProcessBuilder($...X)

  - id: hp-java-sql-string-build
    languages: [java]
    severity: ERROR
    message: >-
      SQL built by string concatenation. A caller-controlled value lands in the query text —
      use a PreparedStatement with bind parameters.
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      category: injection
    patterns:
      - pattern-either:
          - pattern: $ST.executeQuery("..." + $X)
          - pattern: $ST.executeUpdate("..." + $X)
          - pattern: $ST.execute("..." + $X)

  - id: hp-java-unsafe-deserialization
    languages: [java]
    severity: ERROR
    message: >-
      Java native deserialization of a stream. If the bytes are untrusted this is a
      remote-code-execution sink (gadget chains). Avoid ObjectInputStream on untrusted input.
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      category: deserialization
    patterns:
      - pattern-either:
          - pattern: new ObjectInputStream($X).readObject()
          - pattern: (ObjectInputStream $O).readObject()

  # ============================================================ Go
  - id: hp-go-os-command-injection
    languages: [go]
    severity: WARNING
    message: >-
      os/exec command in Go. If the program or its arguments are caller-controlled, validate
      them — never build the command from raw input.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      category: injection
    patterns:
      - pattern-either:
          - pattern: exec.Command($BIN, $...ARGS)
          - pattern: exec.CommandContext($CTX, $BIN, $...ARGS)

  - id: hp-go-sql-string-build
    languages: [go]
    severity: ERROR
    message: >-
      SQL built by string concatenation. Use parameterized queries (placeholders + args), not
      concatenated query text.
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      category: injection
    patterns:
      - pattern-either:
          - pattern: $DB.Query("..." + $X)
          - pattern: $DB.Exec("..." + $X)
          - pattern: $DB.QueryRow("..." + $X)

  - id: hp-go-ssrf-request
    languages: [go]
    severity: WARNING
    message: >-
      Outbound HTTP request to a computed URL. If the URL is caller-controlled this is SSRF —
      allowlist the host/scheme before fetching.
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery"
      category: ssrf
    patterns:
      - pattern-either:
          - pattern: http.Get($X)
          - pattern: http.Post($X, $...REST)

  # ============================================================ PHP
  - id: hp-php-os-command-injection
    languages: [php]
    severity: ERROR
    message: >-
      Shell command from PHP. If any part is caller-controlled this is command injection —
      use escapeshellarg()/escapeshellcmd() or avoid the shell entirely.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      category: injection
    patterns:
      - pattern-either:
          - pattern: system($X)
          - pattern: exec($X)
          - pattern: shell_exec($X)
          - pattern: passthru($X)
          - pattern: popen($X, ...)
          - pattern: proc_open($X, ...)

  - id: hp-php-code-eval
    languages: [php]
    severity: ERROR
    message: >-
      Dynamic code evaluation. eval() on any caller-influenced string is remote code
      execution — remove it or use a safe dispatch table.
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
      category: injection
    patterns:
      - pattern: eval($X)

  - id: hp-php-file-inclusion
    languages: [php]
    severity: WARNING
    message: >-
      Dynamic file inclusion. If the path is caller-controlled this is LFI/RFI — validate
      against an allowlist, never include a raw request value.
    metadata:
      cwe: "CWE-98: Improper Control of Filename for Include/Require Statement"
      owasp: "A03:2021 - Injection"
      category: path-traversal
    patterns:
      - pattern-either:
          - pattern: include($X)
          - pattern: include_once($X)
          - pattern: require($X)
          - pattern: require_once($X)

  # ============================================================ Ruby
  - id: hp-ruby-os-command-injection
    languages: [ruby]
    severity: ERROR
    message: >-
      Shell command from Ruby. system/exec on a caller-controlled string is command
      injection — pass an argv array and avoid the shell.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      category: injection
    patterns:
      - pattern-either:
          - pattern: system($X)
          - pattern: exec($X)
          - pattern: Kernel.system($X)

  - id: hp-ruby-code-eval
    languages: [ruby]
    severity: ERROR
    message: >-
      Dynamic code evaluation. eval / instance_eval / class_eval on caller input is remote
      code execution — remove it.
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
      category: injection
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: $O.instance_eval($X)
          - pattern: $O.class_eval($X)

  - id: hp-ruby-unsafe-deserialization
    languages: [ruby]
    severity: ERROR
    message: >-
      Unsafe deserialization. YAML.load / Marshal.load on untrusted bytes can instantiate
      arbitrary objects (RCE) — use YAML.safe_load and avoid Marshal on untrusted input.
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      category: deserialization
    patterns:
      - pattern-either:
          - pattern: YAML.load($X)
          - pattern: Marshal.load($X)

  # ============================================================ C#
  - id: hp-csharp-os-command-injection
    languages: [csharp]
    severity: WARNING
    message: >-
      Process started from C#. If the file or arguments are caller-controlled this is command
      injection — validate inputs and avoid passing raw input to a shell.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      category: injection
    patterns:
      - pattern-either:
          - pattern: System.Diagnostics.Process.Start($X)
          - pattern: Process.Start($X)

  - id: hp-csharp-sql-string-build
    languages: [csharp]
    severity: ERROR
    message: >-
      SQL built by string concatenation. Use parameterized SqlCommand queries with
      SqlParameter, not concatenated query text.
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      category: injection
    patterns:
      - pattern-either:
          - pattern: new SqlCommand("..." + $X, ...)
          - pattern: new SqlCommand("..." + $X)

  - id: hp-csharp-unsafe-deserialization
    languages: [csharp]
    severity: ERROR
    message: >-
      BinaryFormatter deserialization. It is unsafe on untrusted data (RCE) and deprecated —
      use a safe serializer (System.Text.Json / DataContractSerializer with known types).
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      category: deserialization
    patterns:
      - pattern-either:
          - pattern: (BinaryFormatter $B).Deserialize($X)
          - pattern: new BinaryFormatter().Deserialize($X)
