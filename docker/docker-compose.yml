# HackPit Cockpit — TWO-SANDBOX stack.
#
# There are THREE independent sandboxes with DIFFERENT network models — do not conflate them:
#
# 1. hackpit-kali-sandbox  (ISOLATED — the cockpit/agent sandbox; SAFETY-CRITICAL, unchanged)
#    On `hackpit-isolated` (`internal: true`): Docker attaches no gateway, so there is no NAT
#    and no route off the bridge — it reaches the lab (same network) but has NO path to the
#    host or the internet. This is the safety net the cockpit executor's 4th gate
#    (`assert_isolation_proven`) and the future autonomous agent depend on. It stays egress-less.
#
# 2. hackpit-kali-open     (NOT ISOLATED — the :kali human-only shell; Zaid's informed decision)
#    On `hackpit-open` (a normal bridge, NAT egress): reaches the internet + host + LAN. This is
#    intentional and is used ONLY by :kali (POST /cockpit/kali), which is human-driven — the
#    orchestrator/agent/executor has NO code path to it. It keeps cap_drop ALL + no-new-privileges
#    and is still disposable via `down`. An exposed :kali now reaches your host/LAN — localhost only,
#    auth required before any exposure.
#
# 3. hackpit-engage-sandbox  (FULLY OPEN + PRIVILEGED — the REAL-TARGET engagement sandbox;
#                             SUPERVISED, HIGHEST RISK)
#    The cockpit execs here ONLY in explicit engagement mode (real authorized targets). It has NO
#    isolation floor and NO Wall A (Zaid's informed decision): on a normal NAT bridge it reaches the
#    internet + LAN + host + cloud metadata — nothing bounds WHERE it can reach. It ALSO runs as
#    root with NET_RAW + NET_ADMIN and /dev/net/tun, so SYN scans, tcpdump, raw sockets and VPN
#    all work. The ONLY guard is HUMAN APPROVAL OF EVERY COMMAND (explicit entry + approve-each +
#    heuristic red-confirm; never hands-off). Proof: engage_open_proof.sh (full reach).
#
# All sandbox images bake their tools in at build time. The lab image is pulled at `up` time.
#
# Bring up:   docker compose -f docker/docker-compose.yml up -d --build
# Prove:      docker/proof/isolation_proof.sh            (cockpit sandbox: egress-less — hard gate)
#             docker/proof/kali_open_egress_proof.sh     (:kali open sandbox: egress reachable)
# Tear down:  docker compose -f docker/docker-compose.yml down -v

name: hackpit-cockpit

networks:
  hackpit-isolated:
    driver: bridge
    internal: true          # <-- no gateway => no host/internet route. The safety layer.
  hackpit-open:
    driver: bridge
    # NOT internal: normal bridge with NAT egress. Reaches internet + host + LAN. Used ONLY
    # by the :kali human-only shell (hackpit-kali-open). Deliberately not isolated.
  hackpit-engage:
    driver: bridge
    # NOT internal: a normal NAT bridge with FULL reach (internet + LAN + host + metadata). The
    # engagement sandbox sits here directly — Wall A is DOWN (no firewall sidecar). The only guard
    # on a real-target run is human-approval-of-every-command (never hands-off).

services:
  lab-target:
    # OWASP Juice Shop — the self-hosted vulnerable web app (M1 lab target).
    image: bkimminich/juice-shop:latest
    container_name: hackpit-lab-target
    hostname: hackpit-lab-target
    networks:
      - hackpit-isolated
    restart: unless-stopped
    # No published ports: the lab is reachable only from inside the isolated network.

  kali-sandbox:
    # The recon sandbox the backend execs allowlisted commands into.
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: hackpit/kali-sandbox:m1
    container_name: hackpit-kali-sandbox
    hostname: hackpit-kali-sandbox
    networks:
      - hackpit-isolated
    restart: unless-stopped
    # Defense in depth beyond network isolation. UNCHANGED by the D3 privilege work: this is
    # the sandbox that hosts unattended agent runs, so it keeps the image's unprivileged
    # `sandbox` user, no added capabilities and no devices. Only engage-sandbox is elevated.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false

  kali-open:
    # The :kali human-only shell sandbox. SAME image/tools as the isolated sandbox, but on a
    # NORMAL bridge network (NAT egress) — it reaches the internet, the host, and the LAN. That
    # is Zaid's informed decision and is used ONLY by POST /cockpit/kali (human-driven; the
    # orchestrator/agent has no path to it). NOT isolated — do NOT point cockpit/agent execution
    # here (the cockpit keeps targeting hackpit-kali-sandbox with all four gates intact).
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: hackpit/kali-sandbox:m1
    container_name: hackpit-kali-open
    hostname: hackpit-kali-open
    networks:
      - hackpit-open
    restart: unless-stopped
    # Defense in depth is KEPT even though the network is open — non-root, no capabilities,
    # no devices. `:kali` gets the full new toolset (D4) but not the engage sandbox's privileges.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false

  engage-sandbox:
    # The REAL-TARGET engagement sandbox — FULLY OPEN (Wall A DOWN, Zaid's informed decision).
    # On a normal NAT bridge (`hackpit-engage`) with FULL network reach: internet + LAN + host
    # + cloud metadata. There is NO isolation floor and NO Wall-A firewall — nothing bounds
    # WHERE it can reach. The ONLY guard on a real-target run is HUMAN APPROVAL OF EVERY COMMAND
    # (explicit engagement entry + approve-each + heuristic red-confirm; never hands-off).
    # The cockpit execs here ONLY in explicit, human-entered engagement mode. NOT for lab runs
    # (the lab keeps its egress-less, unprivileged, isolated sandbox).
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: hackpit/kali-sandbox:m1
    container_name: hackpit-engage-sandbox
    hostname: hackpit-engage-sandbox
    networks:
      - hackpit-engage
    # --- PRIVILEGE: this service, and ONLY this service, is elevated (D3) ------------------
    # Same image as the other two sandboxes; the elevation lives here in the runtime posture.
    #   user: root       — write access to root-owned files (appending /etc/hosts to point at a
    #                      DC is the day-one AD case). The image default is `sandbox`, uid 1000.
    #   NET_RAW          — nmap -sS/-sU/-O, masscan, arp-scan, tcpdump, any raw socket. Without
    #                      it nmap silently degrades to a -sT connect scan: slower AND louder.
    #   NET_ADMIN        — bringing up the VPN tun interface and setting routes.
    #   /dev/net/tun     — the device openvpn needs for an HTB/PG/client VPN.
    #
    # cap_drop: ALL still runs FIRST, so this is an explicit two-capability grant, not "root
    # with the Docker default set" — verified: CapEff is exactly cap_net_admin,cap_net_raw.
    # Two consequences worth knowing before you debug them at 2am:
    #   * NO CAP_NET_BIND_SERVICE — responder / ntlmrelayx still cannot bind :53/:137/:445,
    #     and no reverse shell can listen below port 1024. Add it deliberately if wanted.
    #   * NO CAP_CHOWN/SETUID/DAC_OVERRIDE — so `apt-get install` inside a running engagement
    #     sandbox will not work. Tools belong in Dockerfile.sandbox, which is the intent.
    user: root
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    read_only: false
    restart: unless-stopped
