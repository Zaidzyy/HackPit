# MITRE ATT&CK kill-chain reference — the tactics an engagement moves through and a
# representative set of techniques under each, keyed by ATT&CK id.
#
# PORTED FROM Decepticon (tools/references/killchain.yaml), Apache-2.0 — see
# THIRD_PARTY_LICENSES and NOTICE. Reshaped for HackPit: this is a PURE DATA reference the
# OPPLAN maps objectives onto and the coverage view renders. It is READ, never executed;
# nothing here reaches a subprocess, a socket, or the executor gate.
#
# The `phase` field ties each tactic to Decepticon's kill-chain phases (recon / initial-access /
# post-exploit / c2 / exfiltration) so an OPPLAN objective declared in a phase can
# surface the tactics it is expected to exercise. Technique ids are the anchors — a coverage
# view is "which of these techniques did the engagement's objectives touch", so it stays a
# lexical id match with no ATT&CK API call at render time.

tactics:
  - id: TA0043
    name: Reconnaissance
    phase: recon
    techniques:
      - { id: T1595, name: Active Scanning }
      - { id: T1592, name: Gather Victim Host Information }
      - { id: T1590, name: Gather Victim Network Information }
      - { id: T1589, name: Gather Victim Identity Information }
      - { id: T1596, name: Search Open Technical Databases }
      - { id: T1598, name: Phishing for Information }

  - id: TA0042
    name: Resource Development
    phase: recon
    techniques:
      - { id: T1583, name: Acquire Infrastructure }
      - { id: T1587, name: Develop Capabilities }
      - { id: T1588, name: Obtain Capabilities }
      - { id: T1608, name: Stage Capabilities }

  - id: TA0001
    name: Initial Access
    phase: initial-access
    techniques:
